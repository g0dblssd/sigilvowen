name: Release installers

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.7.2
      GODOT_STATUS: stable
      GODOT_HOME: ${{ github.workspace }}/.ci/godot
      TEMPLATES_HOME: ${{ github.workspace }}/.ci/templates

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Download Godot .NET editor and templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GODOT_HOME" "$TEMPLATES_HOME" "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}.mono"
          curl -L --fail --retry 3 -o /tmp/godot-editor.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_mono_linux_x86_64.zip"
          curl -L --fail --retry 3 -o /tmp/godot-templates.tpz "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_mono_export_templates.tpz"
          unzip -q /tmp/godot-editor.zip -d "$GODOT_HOME"
          unzip -q -j /tmp/godot-templates.tpz \
            templates/version.txt \
            templates/linux_debug.x86_64 templates/linux_release.x86_64 \
            templates/windows_debug_x86_64.exe templates/windows_debug_x86_64_console.exe \
            templates/windows_release_x86_64.exe templates/windows_release_x86_64_console.exe \
            -d "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}.mono"
          GODOT_BIN="$(find "$GODOT_HOME" -type f -name 'Godot*_mono_linux.x86_64' -print -quit)"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Restore platform runtimes
        shell: bash
        run: |
          dotnet restore Sigilwoven.sln --runtime linux-x64 -p:NuGetAudit=false
          dotnet restore Sigilwoven.sln --runtime win-x64 -p:NuGetAudit=false

      - name: Export Linux and Windows
        shell: bash
        run: ./tools/build-release.sh

      - name: Build Linux installer
        shell: bash
        run: ./tools/package-linux-installer.sh

      - name: Build Windows installer
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis
          mkdir -p build/installers
          makensis \
            -DSOURCE_DIR="$GITHUB_WORKSPACE/build/windows" \
            -DOUTPUT_FILE="$GITHUB_WORKSPACE/build/installers/Sigilwoven-Setup-Windows-x86_64.exe" \
            installer/windows/Sigilwoven.nsi

      - name: Create checksums
        shell: bash
        run: |
          cd build
          sha256sum \
            installers/Sigilwoven-Installer-Linux-x86_64.run \
            installers/Sigilwoven-Setup-Windows-x86_64.exe \
            packages/Sigilwoven-linux-x86_64.tar.gz \
            packages/Sigilwoven-windows-x86_64.zip \
            > installers/SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/installers/Sigilwoven-Installer-Linux-x86_64.run \
            build/installers/Sigilwoven-Setup-Windows-x86_64.exe \
            build/installers/SHA256SUMS.txt \
            build/packages/Sigilwoven-linux-x86_64.tar.gz \
            build/packages/Sigilwoven-windows-x86_64.zip \
            --title "Sigilwoven Patch 039 — Linux & Windows installers" \
            --notes-file logs/patch-039.md
